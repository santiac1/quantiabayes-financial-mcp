version: "3.9"

services:
  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    volumes:
      - ./backend:/app
      - stan_models:/app/stan_cache
    environment:
      - REDIS_URL=redis://redis:6379/0
      - BROKER_URL=redis://redis:6379/1
      - RESULT_BACKEND=redis://redis:6379/2
      - STAN_MODEL_DIR=/app/stan_cache
    depends_on:
      - redis
      - supabase_db
    ports:
      - "8000:8000"

  celery_worker:
    build: ./backend
    command: celery -A app.worker worker --loglevel=info
    volumes:
      - ./backend:/app
      - stan_models:/app/stan_cache
    environment:
      - REDIS_URL=redis://redis:6379/0
      - BROKER_URL=redis://redis:6379/1
      - RESULT_BACKEND=redis://redis:6379/2
      - STAN_MODEL_DIR=/app/stan_cache
    depends_on:
      - redis
      - supabase_db

  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"

  supabase_db:
    image: supabase/postgres:15.1.0
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - supabase_data:/var/lib/postgresql/data

  frontend:
    build: ./frontend
    command: npm run dev
    volumes:
      - ./frontend:/app
    environment:
      - NEXT_PUBLIC_API_BASE=http://localhost:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  stan_models:
  supabase_data:
